      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="opt2-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4facfe" flood-opacity="0.35" />
